<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="view-transition" content="same-origin">
    <title>Iniciar Sesión - Traductor Médico K'iche'</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            background: url("{{ url_for('static', filename='backgroundLogin.jpeg') }}") center center / cover no-repeat fixed;
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem 1rem;
        }
        /* Capa de oscurecimiento más sutil para que la imagen resalte más */
        .overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 23, 42, 0.4); 
            z-index: 1;
        }
        /* Estilo Glassmorphism super evidente y premium */
        .card {
            position: relative;
            z-index: 2;
            background: rgba(255, 255, 255, 0.05); /* Fondo casi transparente */
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-top: 1px solid rgba(255, 255, 255, 0.25);
            border-left: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 20px;
            padding: 2.5rem 2rem;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            view-transition-name: auth-card;
        }
        h2 { font-weight: 700; text-align: center; margin-bottom: 0.3rem; letter-spacing: -0.02em; font-size: 1.5rem; text-shadow: 0 2px 4px rgba(0,0,0,0.3); }
        p.subtitle { color: #E2E8F0; text-align: center; margin-bottom: 1.5rem; font-size: 0.85rem; font-weight: 400; }
        
        label { display: block; font-size: 0.75rem; color: #E2E8F0; margin-bottom: 0.4rem; font-weight: 500; letter-spacing: 0.03em; text-transform: uppercase; }
        
        input[type=text], input[type=password] {
            width: 100%;
            background: rgba(15, 23, 42, 0.6); /* #0F172A para el input */
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: white;
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            padding: 0.75rem 1rem;
            outline: none;
            transition: all 0.3s ease;
        }
        .input-group { margin-bottom: 1.25rem; }
        .password-wrapper { position: relative; width: 100%; display: flex; align-items: center; }
        .password-wrapper input { padding-right: 2.5rem; }
        .toggle-password {
            position: absolute; right: 12px; background: none; border: none;
            color: rgba(255, 255, 255, 0.5); cursor: pointer; transition: color 0.2s; padding: 0; display: flex;
        }
        .toggle-password:hover { color: white; }
        
        input:focus { 
            border-color: #059669; /* Jade Oscuro */
            box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.25); 
            background: rgba(15, 23, 42, 0.8);
        }
        
        .btn-primary {
            background: #10B981; /* Verde Jade puro */
            color: #0F172A; /* Contraste alto */
            border: none;
            padding: 0.85rem;
            border-radius: 12px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 700;
            width: 100%;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.25);
            margin-top: 0.25rem;
            margin-bottom: 1.5rem;
        }
        .btn-primary:hover { 
            background: #059669; /* Jade Oscuro */
            transform: translateY(-2px); 
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.35);
            color: white;
        }
        
        .links { text-align: center; font-size: 0.9rem; display: flex; flex-direction: column; gap: 0.8rem; }
        a.link-simple { color: #10B981; text-decoration: none; font-weight: 600; transition: color 0.2s; }
        a.link-simple:hover { color: #34d399; }
        
        /* Botón Flotante Crear Cuenta (Google) */
        .btn-google-register {
            position: fixed;
            top: 1.5rem;
            right: 1.5rem;
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-top: 1px solid rgba(255, 255, 255, 0.3);
            border-left: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 50px;
            padding: 0.5rem;
            color: white;
            text-decoration: none;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            z-index: 10;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            width: 44px; /* Icon 24 + Padding 16 + borders */
            height: 44px;
        }
        .btn-google-register:hover {
            width: 175px; 
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.4);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }
        .btn-google-register svg {
            width: 24px;
            height: 24px;
            flex-shrink: 0;
            color: white;
            margin-left: 1px;
        }
        .btn-google-text {
            white-space: nowrap;
            opacity: 0;
            margin-left: 0.7rem;
            font-size: 0.95rem;
            font-weight: 600;
            transition: opacity 0.2s ease;
        }
        .btn-google-register:hover .btn-google-text {
            opacity: 1;
            transition-delay: 0.15s;
        }
        
        @media (max-width: 480px) {
            .btn-google-register { top: 1rem; right: 1rem; }
        }
        
        .alert { padding: 1rem; border-radius: 12px; margin-bottom: 1.5rem; font-size: 0.95rem; text-align: center; font-weight: 500; backdrop-filter: blur(8px); }
        .alert-error { background: rgba(186, 21, 17, 0.2); color: #ff8a87; border: 1px solid rgba(186, 21, 17, 0.4); } /* Rojo Cinabrio */
        .alert-success { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.4); }
    
        .card {
            animation: smokeIn 0.8s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }
        .card.smoke-out {
            animation: smokeOut 0.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }
        @keyframes smokeIn {
            0% { opacity: 0; filter: blur(15px); transform: translateY(10px) scale(0.98); }
            100% { opacity: 1; filter: blur(0); transform: translateY(0) scale(1); }
        }
        @keyframes smokeOut {
            0% { opacity: 1; filter: blur(0); transform: scale(1); }
            100% { opacity: 0; filter: blur(15px); transform: translateY(-10px) scale(0.98); }
        }
</style>

    <link rel="icon" type="image/png" href="/static/favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/static/favicon/favicon.svg" />
    <link rel="shortcut icon" href="/static/favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/static/favicon/apple-touch-icon.png" />
    <link rel="manifest" href="/static/favicon/site.webmanifest" />
</head>
<body>
    <div class="overlay"></div>
    
    <!-- Botón Flotante Animado Esquina -->
    <a href="/register" class="btn-google-register">
        <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 0 24 24" width="24px" fill="currentColor">
            <path d="M0 0h24v24H0V0z" fill="none"/>
            <path d="M15 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0-6c1.1 0 2 .9 2 2s-.9 2-2 2-2-.9-2-2 .9-2 2-2zm0 8c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4zm-6 4c.22-.72 3.31-2 6-2 2.7 0 5.8 1.29 6 2H9zm-3-3v-3h3v-2H6V5H4v3H1v2h3v3z"/>
        </svg>
        <span class="btn-google-text">Crear cuenta</span>
    </a>

    <div class="card">
        <div style="text-align: center; margin-bottom: 0.5rem; margin-top: -1rem;">
            <img src="{{ url_for('static', filename='logo.png') }}" alt="Chawebal Logo" style="max-width: 280px; width: 100%; height: auto; display: inline-block; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.4));">
        </div>
        <h2 style="font-size: 1.05rem; opacity: 0.85; margin-bottom: 1.5rem; font-weight: 500;">Iniciar Sesión</h2>
        
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" id="loginForm">
            <label for="username">Usuario</label>
            <div class="input-group">
                <input type="text" id="username" name="username" required autocomplete="username" placeholder="Ingresa tu usuario" autofocus aria-label="Nombre de usuario" title="Ingresa tu nombre de usuario registrado">
            </div>
            
            <label for="password">Contraseña</label>
            <div class="input-group password-wrapper">
                <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="••••••••" aria-label="Contraseña" title="Ingresa tu contraseña">
                <button type="button" class="toggle-password" id="togglePassword" aria-label="Mostrar u ocultar contraseña" title="Mostrar contraseña">
                    <svg xmlns="http://www.w3.org/2000/svg" height="20px" viewBox="0 0 24 24" width="20px" fill="currentColor">
                        <path d="M0 0h24v24H0V0z" fill="none"/>
                        <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
                    </svg>
                </button>
            </div>
            
            <button type="submit" class="btn-primary" id="loginBtn">Ingresar</button>
        </form>
        
        <div class="links">
            <a href="/recover" class="link-simple">¿Olvidaste tu contraseña?</a>
        </div>
    </div>

    <script>
        // Heurística 5: Prevención de errores (Mostrar contraseña para evitar equivocarse)
        const togglePassword = document.getElementById('togglePassword');
        const password = document.getElementById('password');
        
        togglePassword.addEventListener('click', function () {
            const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
            password.setAttribute('type', type);
            // Efecto visual en el icono para saber que está activo
            this.style.color = type === 'text' ? 'white' : 'rgba(255, 255, 255, 0.5)';
        });

        // Heurística 1: Visibilidad del estado del sistema (Feedback visual de carga)
        // Heurística 5: Prevención de errores (Prevenir doble clic/doble envío)
        const loginForm = document.getElementById('loginForm');
        const loginBtn = document.getElementById('loginBtn');
        
        loginForm.addEventListener('submit', function() {
            loginBtn.innerHTML = 'Ingresando...';
            loginBtn.style.opacity = '0.7';
            loginBtn.style.pointerEvents = 'none';
        });
    </script>

    <script>
        // Animación de humo al cambiar de página (enlaces)
        document.querySelectorAll('a').forEach(link => {
            link.addEventListener('click', function(e) {
                // If it's a real link inside our site
                if (this.href && !this.href.includes('#') && this.getAttribute('target') !== '_blank') {
                    e.preventDefault();
                    const target = this.href;
                    const card = document.querySelector('.card');
                    if (card) card.classList.add('smoke-out');
                    setTimeout(() => {
                        window.location.href = target;
                    }, 400);
                }
            });
        });

        // Animación de humo al enviar el formulario
        const form = document.querySelector('form');
        if (form) {
            form.addEventListener('submit', function(e) {
                // Let the browser validate first. If valid, we intercept.
                if (this.checkValidity()) {
                    e.preventDefault();
                    const card = document.querySelector('.card');
                    if (card) card.classList.add('smoke-out');
                    
                    // We must submit the form properly bypassing the event listener
                    setTimeout(() => {
                        HTMLFormElement.prototype.submit.call(this);
                    }, 400);
                }
            });
        }
    </script>
</body>

</html>
