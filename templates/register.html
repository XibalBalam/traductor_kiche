<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="view-transition" content="same-origin">
    <title>Registro - Traductor Médico K'iche'</title>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            background: url("{{ url_for('static', filename='backgroundLogin.jpeg') }}") center center / cover no-repeat fixed;
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem 1rem;
        }
        /* Capa de oscurecimiento más sutil para que la imagen resalte más */
        .overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 23, 42, 0.4); 
            z-index: 1;
        }
        /* Estilo Glassmorphism super evidente y premium */
        .card {
            position: relative;
            z-index: 2;
            background: rgba(255, 255, 255, 0.05); /* Fondo casi transparente */
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-top: 1px solid rgba(255, 255, 255, 0.25);
            border-left: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 20px;
            padding: 2.5rem 2rem;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            view-transition-name: auth-card;
        }
        h2 { font-weight: 700; text-align: center; margin-bottom: 0.3rem; letter-spacing: -0.02em; font-size: 1.5rem; text-shadow: 0 2px 4px rgba(0,0,0,0.3); }
        p.subtitle { color: #E2E8F0; text-align: center; margin-bottom: 1.5rem; font-size: 0.85rem; font-weight: 400; }
        
        label { display: block; font-size: 0.75rem; color: #E2E8F0; margin-bottom: 0.4rem; font-weight: 500; letter-spacing: 0.03em; text-transform: uppercase; }
        
        input[type=text], input[type=password], select {
            width: 100%;
            background: rgba(15, 23, 42, 0.6); /* #0F172A para el input */
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: white;
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            padding: 0.75rem 1rem;
            outline: none;
            transition: all 0.3s ease;
            appearance: none; /* Para limpiar estilos nativos del select */
        }
        .input-group { margin-bottom: 1.25rem; }
        .password-wrapper { position: relative; width: 100%; display: flex; align-items: center; }
        .password-wrapper input { padding-right: 2.5rem; }
        .toggle-password {
            position: absolute; right: 12px; background: none; border: none;
            color: rgba(255, 255, 255, 0.5); cursor: pointer; transition: color 0.2s; padding: 0; display: flex;
        }
        .toggle-password:hover { color: white; }
        
        input:focus, select:focus { 
            border-color: #059669; /* Jade Oscuro */
            box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.25); 
            background: rgba(15, 23, 42, 0.8);
        }
        select option { background: #0F172A; color: white; }
        
        .btn-primary {
            background: #10B981; /* Verde Jade puro */
            color: #0F172A; /* Contraste alto */
            border: none;
            padding: 0.85rem;
            border-radius: 12px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 700;
            width: 100%;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.25);
            margin-top: 0.25rem;
            margin-bottom: 1.5rem;
        }
        .btn-primary:hover { 
            background: #059669; /* Jade Oscuro */
            transform: translateY(-2px); 
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.35);
            color: white;
        }
        
        .links { text-align: center; font-size: 0.9rem; display: flex; flex-direction: column; gap: 0.8rem; }
        a.link-simple { display: inline-flex; align-items: center; justify-content: center; color: #10B981; text-decoration: none; font-weight: 600; transition: color 0.2s; }
        a.link-simple:hover { color: #34d399; }
        
        .alert { padding: 1rem; border-radius: 12px; margin-bottom: 1.5rem; font-size: 0.95rem; text-align: center; font-weight: 500; backdrop-filter: blur(8px); }
        .alert-error { background: rgba(186, 21, 17, 0.2); color: #ff8a87; border: 1px solid rgba(186, 21, 17, 0.4); } /* Rojo Cinabrio */
        .alert-success { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.4); }
    </style>

    <link rel="icon" type="image/png" href="/static/favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/static/favicon/favicon.svg" />
    <link rel="shortcut icon" href="/static/favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/static/favicon/apple-touch-icon.png" />
    <link rel="manifest" href="/static/favicon/site.webmanifest" />
</head>
<body>
    <div class="overlay"></div>
    <div class="card">
        <div style="text-align: center; margin-bottom: 0.5rem; margin-top: -1rem;">
            <img src="{{ url_for('static', filename='logo.png') }}" alt="Chawebal Logo" style="max-width: 280px; width: 100%; height: auto; display: inline-block; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.4));">
        </div>
        <h2 style="font-size: 1.05rem; opacity: 0.85; margin-bottom: 1.5rem; font-weight: 500;">Crear Cuenta</h2>
        
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" id="registerForm">
            <label for="username">Usuario</label>
            <div class="input-group">
                <input type="text" id="username" name="username" required autocomplete="username" placeholder="Elige un usuario" autofocus aria-label="Nombre de usuario elegido" title="Elige un nombre de usuario único">
            </div>
            
            <label for="password">Contraseña</label>
            <div class="input-group password-wrapper">
                <input type="password" id="password" name="password" required autocomplete="new-password" placeholder="Crea tu contraseña" aria-label="Contraseña" title="Crea una contraseña segura">
                <button type="button" class="toggle-password" aria-label="Mostrar u ocultar contraseña" title="Mostrar contraseña">
                    <svg xmlns="http://www.w3.org/2000/svg" height="20px" viewBox="0 0 24 24" width="20px" fill="currentColor"><path d="M0 0h24v24H0V0z" fill="none"/><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
                </button>
            </div>
            
            <label for="security_question">Pregunta de Seguridad (Recuperación)</label>
            <div class="input-group">
                <select id="security_question" name="security_question" required aria-label="Pregunta de seguridad">
                    <option value="¿Cuál es el nombre de tu primera mascota?">¿Cuál es el nombre de tu primera mascota?</option>
                    <option value="¿En qué ciudad naciste?">¿En qué ciudad naciste?</option>
                    <option value="¿Cuál era el nombre de tu mejor amigo de la infancia?">¿Cuál era el nombre de tu mejor amigo de la infancia?</option>
                    <option value="¿Cuál es tu comida favorita?">¿Cuál es tu comida favorita?</option>
                </select>
            </div>
            
            <label for="security_answer">Respuesta secreta</label>
            <div class="input-group password-wrapper">
                <input type="password" id="security_answer" name="security_answer" required placeholder="Escribe tu respuesta" aria-label="Respuesta secreta" title="Tu respuesta secreta">
                <button type="button" class="toggle-password" aria-label="Mostrar u ocultar respuesta" title="Mostrar respuesta">
                    <svg xmlns="http://www.w3.org/2000/svg" height="20px" viewBox="0 0 24 24" width="20px" fill="currentColor"><path d="M0 0h24v24H0V0z" fill="none"/><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
                </button>
            </div>
            
            <button type="submit" class="btn-primary" id="registerBtn">Registrarse</button>
        </form>
        
        <div class="links">
            <a href="/login" class="link-simple"><span class="material-symbols-outlined" style="margin-right: 4px; font-size: 1.1rem;">arrow_back</span> Ya tengo cuenta, Iniciar Sesión</a>
        </div>
    </div>
    
    <script>
        // Heurística 5: Prevención de errores (Mostrar contraseñas)
        document.querySelectorAll('.toggle-password').forEach(btn => {
            btn.addEventListener('click', function() {
                const input = this.previousElementSibling;
                const type = input.getAttribute('type') === 'password' ? 'text' : 'password';
                input.setAttribute('type', type);
                this.style.color = type === 'text' ? 'white' : 'rgba(255, 255, 255, 0.5)';
            });
        });
        
        // Heurística 1 y 5: Estado de carga y bloqueo de doble submit
        const registerForm = document.getElementById('registerForm');
        const registerBtn = document.getElementById('registerBtn');
        if (registerForm) {
            registerForm.addEventListener('submit', function() {
                registerBtn.innerHTML = 'Registrando...';
                registerBtn.style.opacity = '0.7';
                registerBtn.style.pointerEvents = 'none';
            });
        }
    </script>
</body>
</html>
