<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Revisar y Aprobar Variantes</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 2em; }
        .card { background: #f9f9f9; border-radius: 8px; padding: 2em; max-width: 800px; margin: auto; box-shadow: 0 2px 8px #0001; }
        table { width: 100%; border-collapse: collapse; margin-top: 1em; }
        th, td { border: 1px solid #ccc; padding: 0.5em; text-align: left; }
        th { background: #eee; }
        select { padding: 0.3em; }
        button { border: none; padding: 0.5em 1em; border-radius: 4px; cursor: pointer; margin-right: 0.5em; }
        .btn-approve { background: #28a745; color: white; }
        .btn-delete { background: #dc3545; color: white; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Panel de Revisión y Aprobación</h2>
        <a href="/escritura" style="display:inline-block; margin-bottom:1em; color:#007bff; text-decoration:none;">← Volver a Escritura</a>
        
        {% if variantes|length == 0 %}
            <p>No hay traducciones pendientes de revisión.</p>
        {% else %}
            <table>
                <tr>
                    <th>Español</th>
                    <th>K'iche' (Sugerido)</th>
                    <th>Categoría Destino</th>
                    <th>Acciones</th>
                </tr>
                {% for v in variantes %}
                <tr id="row-{{ loop.index }}">
                    <td id="esp-{{ loop.index }}">{{ v.espanol }}</td>
                    <td id="kich-{{ loop.index }}">{{ v.kiche }}</td>
                    <td>
                        <select id="cat-{{ loop.index }}">
                            {% for c in categorias %}
                                <option value="{{ c }}" {% if c == v.recomendada %}selected{% endif %}>{{ c }}</option>
                            {% endfor %}
                        </select>
                    </td>
                    <td>
                        <button class="btn-approve" onclick="aprobar({{ loop.index }})">Aprobar</button>
                        <button class="btn-delete" onclick="eliminar({{ loop.index }})">Eliminar</button>
                    </td>
                </tr>
                {% endfor %}
            </table>
        {% endif %}
    </div>

    <script>
        function aprobar(index) {
            const espanol = document.getElementById(`esp-${index}`).innerText;
            const kiche = document.getElementById(`kich-${index}`).innerText;
            const categoria = document.getElementById(`cat-${index}`).value;

            fetch('/aprobar', {
                method: 'POST',
                headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                body: new URLSearchParams({espanol, kiche, categoria})
            }).then(r => r.json()).then(res => {
                if(res.status === 'ok') {
                    document.getElementById(`row-${index}`).remove();
                    alert('¡Aprobado y guardado en el diccionario!');
                } else {
                    alert('Error: ' + res.error);
                }
            });
        }

        function eliminar(index) {
            if(!confirm('¿Estás seguro de eliminar esta sugerencia?')) return;
            const espanol = document.getElementById(`esp-${index}`).innerText;
            const kiche = document.getElementById(`kich-${index}`).innerText;

            fetch('/eliminar_variante', {
                method: 'POST',
                headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                body: new URLSearchParams({espanol, kiche})
            }).then(r => r.json()).then(res => {
                if(res.status === 'ok') {
                    document.getElementById(`row-${index}`).remove();
                }
            });
        }
    </script>
</body>
</html>
