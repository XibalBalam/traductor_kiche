<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revisar y Aprobar Variantes</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0a0a1a 0%, #1a1a3e 50%, #0a1a2e 100%);
            color: white;
            min-height: 100vh;
            padding: 1.5rem 1rem;
        }

        .back-link {
            display: inline-block;
            color: rgba(255, 255, 255, 0.5);
            text-decoration: none;
            font-size: 0.85rem;
            margin-bottom: 1rem;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: white;
        }

        .container {
            max-width: 800px;
            margin: auto;
        }

        h2 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            text-align: center;
        }

        .empty-state {
            background: rgba(255, 255, 255, 0.05);
            border: 1px dashed rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            padding: 3rem 1rem;
            text-align: center;
            color: rgba(255, 255, 255, 0.6);
        }

        .variant-card {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 1.2rem;
            margin-bottom: 1rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            transition: transform 0.2s, background 0.2s;
        }

        .variant-card:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.2);
        }

        @media (min-width: 600px) {
            .variant-card {
                flex-direction: row;
                align-items: center;
                justify-content: space-between;
            }
        }

        .variant-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }

        .info-group {
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
        }

        label {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.5);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .text-value {
            font-size: 1.1rem;
            font-weight: 500;
        }

        .kiche-text {
            color: #a78bfa;
            font-weight: 600;
        }

        .styled-select {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 0.5rem;
            border-radius: 6px;
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            outline: none;
            width: 100%;
            max-width: 250px;
        }
        
        .styled-select option {
            background: #1a1a3e;
            color: white;
        }

        .variant-actions {
            display: flex;
            gap: 0.5rem;
            flex-shrink: 0;
        }

        @media (max-width: 599px) {
            .variant-actions {
                width: 100%;
            }
            .variant-actions button {
                flex: 1;
            }
        }

        button {
            border: none;
            padding: 0.7rem 1.2rem;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn-approve {
            background: rgba(16, 185, 129, 0.15);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .btn-approve:hover {
            background: rgba(16, 185, 129, 0.3);
        }

        .btn-delete {
            background: rgba(244, 63, 94, 0.15);
            color: #fb7185;
            border: 1px solid rgba(244, 63, 94, 0.3);
        }

        .btn-delete:hover {
            background: rgba(244, 63, 94, 0.3);
        }

    </style>
</head>
<body>
    <div class="container">
        <a class="back-link" href="/escritura" style="display: flex; align-items: center; gap: 4px;">
            <span class="material-symbols-outlined" style="font-size: 1rem;">arrow_back</span> Volver a Práctica de Escritura
        </a>
        
        <h2>Panel de Revisión y Aprobación</h2>
        
        {% if variantes|length == 0 %}
            <div class="empty-state">
                <div style="margin-bottom: 1rem;"><span class="material-symbols-outlined" style="font-size: 3rem;">inbox</span></div>
                <p>No hay traducciones pendientes de revisión en este momento.</p>
            </div>
        {% else %}
            <div class="variants-list">
                {% for v in variantes %}
                <div class="variant-card" id="row-{{ loop.index }}">
                    
                    <div class="variant-info">
                        <div class="info-group">
                            <label>Español</label>
                            <div class="text-value" id="esp-{{ loop.index }}">{{ v.espanol }}</div>
                        </div>
                        
                        <div class="info-group">
                            <label>K'iche' (Sugerido)</label>
                            <div class="text-value kiche-text" id="kich-{{ loop.index }}">{{ v.kiche }}</div>
                        </div>
                        
                        <div class="info-group">
                            <label>Categoría Destino</label>
                            <select class="styled-select" id="cat-{{ loop.index }}">
                                {% for c in categorias %}
                                    <option value="{{ c }}" {% if c == v.recomendada %}selected{% endif %}>{{ c }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                    
                    <div class="variant-actions">
                        <button class="btn-approve" onclick="aprobar({{ loop.index }})" title="Aprobar y guardar al diccionario principal">
                            <span class="material-symbols-outlined" style="font-size: 1.2rem;">check_circle</span> Aprobar
                        </button>
                        <button class="btn-delete" onclick="eliminar({{ loop.index }})" title="Eliminar definitivamente esta variante">
                            <span class="material-symbols-outlined" style="font-size: 1.2rem;">delete</span> Descartar
                        </button>
                    </div>
                    
                </div>
                {% endfor %}
            </div>
        {% endif %}
    </div>

    <script>
        function showToast(msg, color = '#34d399') {
            const toast = document.createElement('div');
            toast.textContent = msg;
            toast.style.position = 'fixed';
            toast.style.bottom = '20px';
            toast.style.left = '50%';
            toast.style.transform = 'translateX(-50%)';
            toast.style.background = 'rgba(0,0,0,0.8)';
            toast.style.color = color;
            toast.style.padding = '12px 24px';
            toast.style.borderRadius = '8px';
            toast.style.zIndex = '1000';
            toast.style.border = `1px solid ${color}`;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        function aprobar(index) {
            const espanol = document.getElementById(`esp-${index}`).innerText;
            const kiche = document.getElementById(`kich-${index}`).innerText;
            const categoria = document.getElementById(`cat-${index}`).value;
            const row = document.getElementById(`row-${index}`);
            
            row.style.opacity = '0.5';

            fetch('/aprobar', {
                method: 'POST',
                headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                body: new URLSearchParams({espanol, kiche, categoria})
            }).then(r => r.json()).then(res => {
                if(res.status === 'ok') {
                    row.remove();
                    showToast('✅ Aprobado y guardado en el diccionario');
                    
                    // Check if empty
                    if (document.querySelectorAll('.variant-card').length === 0) {
                        location.reload(); // Reloads to show empty state
                    }
                } else {
                    row.style.opacity = '1';
                    alert('Error: ' + res.error);
                }
            }).catch(err => {
                row.style.opacity = '1';
                alert('Error de conexión.');
            });
        }

        function eliminar(index) {
            if(!confirm('¿Estás seguro de descartar definitivamente esta traducción sugerida?')) return;
            
            const espanol = document.getElementById(`esp-${index}`).innerText;
            const kiche = document.getElementById(`kich-${index}`).innerText;
            const row = document.getElementById(`row-${index}`);
            
            row.style.opacity = '0.5';

            fetch('/eliminar_variante', {
                method: 'POST',
                headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                body: new URLSearchParams({espanol, kiche})
            }).then(r => r.json()).then(res => {
                if(res.status === 'ok') {
                    row.remove();
                    showToast('🗑️ Variante descartada', '#fb7185');
                    
                    // Check if empty
                    if (document.querySelectorAll('.variant-card').length === 0) {
                        location.reload(); // Reloads to show empty state
                    }
                } else {
                    row.style.opacity = '1';
                    alert('Error: no se pudo eliminar');
                }
            }).catch(err => {
                row.style.opacity = '1';
                alert('Error de conexión.');
            });
        }
    </script>
</body>
</html>
