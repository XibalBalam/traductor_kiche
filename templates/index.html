<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traductor K'iche' ↔ Español</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .container {
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(20px);
            padding: 2rem;
            border-radius: 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.12);
            width: 100%;
            max-width: 520px;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 1.5rem;
            letter-spacing: -0.5px;
        }

        /* MODE TOGGLE */
        .mode-toggle {
            display: flex;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 50px;
            padding: 4px;
            margin-bottom: 1.8rem;
            position: relative;
        }

        .mode-btn {
            flex: 1;
            border: none;
            background: transparent;
            color: rgba(255, 255, 255, 0.6);
            padding: 0.6rem 1rem;
            border-radius: 50px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            transition: color 0.3s;
            z-index: 1;
        }

        .mode-btn.active {
            color: white;
        }

        .mode-slider {
            position: absolute;
            top: 4px;
            left: 4px;
            width: calc(50% - 4px);
            height: calc(100% - 8px);
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 50px;
            transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .mode-slider.right {
            transform: translateX(100%);
        }

        /* MIC BUTTON */
        .btn-mic {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            color: white;
            font-size: 36px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
            box-shadow: 0 4px 20px rgba(255, 75, 43, 0.5);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-mic:hover {
            transform: scale(1.08);
        }

        .btn-mic.recording {
            animation: pulse 1.5s infinite;
            background: linear-gradient(135deg, #ff6b6b, #ff416c);
        }

        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(255, 65, 108, 0.7);
            }

            70% {
                box-shadow: 0 0 0 20px rgba(255, 65, 108, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(255, 65, 108, 0);
            }
        }

        /* STATUS */
        .status-text {
            text-align: center;
            font-size: 1rem;
            min-height: 1.4em;
            color: rgba(255, 255, 255, 0.85);
            margin-bottom: 0.8rem;
        }

        /* PROGRESS */
        .progress-container {
            width: 100%;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            margin: 0.8rem 0;
            overflow: hidden;
            display: none;
        }

        .progress-bar {
            width: 0%;
            height: 8px;
            background: linear-gradient(90deg, #667eea, #00b09b);
            transition: width 0.3s ease;
            border-radius: 10px;
        }

        /* RESULT BOX */
        .result-box {
            background: rgba(0, 0, 0, 0.25);
            padding: 1.2rem;
            border-radius: 14px;
            margin-top: 1rem;
            display: none;
            text-align: left;
        }

        .result-label {
            font-size: 0.72rem;
            color: rgba(255, 255, 255, 0.5);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 0.3rem;
            margin-top: 0.8rem;
        }

        .result-label:first-child {
            margin-top: 0;
        }

        /* EDITABLE TRANSCRIPTION */
        .result-textarea {
            width: 100%;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            color: white;
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            padding: 0.6rem 0.8rem;
            resize: none;
            min-height: 60px;
            outline: none;
            transition: border-color 0.2s;
        }

        .result-textarea:focus {
            border-color: rgba(102, 126, 234, 0.6);
        }

        .result-text {
            font-size: 1.05rem;
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 0.3rem;
        }

        /* RE-TRANSLATE BUTTON */
        .btn-retranslate {
            display: block;
            margin: 0.8rem auto 0;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 50px;
            padding: 0.5rem 1.4rem;
            font-size: 0.85rem;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .btn-retranslate:hover {
            transform: scale(1.05);
        }

        audio {
            width: 100%;
            margin-top: 0.8rem;
            border-radius: 8px;
        }

        /* KICHE ONLY NOTE */
        .note-text {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.45);
            text-align: center;
            margin-top: 0.5rem;
        }

        /* ANATOMY HIGHLIGHT */
        .highlight-anatomy {
            border-color: #ff416c !important;
            background-color: rgba(255, 65, 108, 0.4) !important;
            box-shadow: 0 0 15px rgba(255, 65, 108, 0.6);
        }
    </style>
</head>

<body>
    <div class="flex flex-col lg:flex-row gap-6 items-start justify-center w-full max-w-5xl mx-auto">
        <!-- COLUMNA 1: TRADUCTOR -->
        <div class="container">
        <h1>🎙️ Traductor K'iche' ↔ Español</h1>
        <div class="flex flex-wrap justify-center gap-2 mb-6 w-full">
            <a href="/train"
                class="flex items-center justify-center bg-purple-500/15 border border-purple-500/35 text-purple-400 hover:bg-purple-500/30 rounded-full px-4 py-2.5 text-sm font-medium transition-colors text-center w-full sm:w-auto">
                🎓 Modo Entrenamiento
            </a>
            <a href="/escritura"
                class="flex items-center justify-center bg-green-500/15 border border-green-500/35 text-green-400 hover:bg-green-500/30 rounded-full px-4 py-2.5 text-sm font-medium transition-colors text-center w-full sm:w-auto">
                ✍️ Práctica de Escritura
            </a>
            <a href="/actualizar-reglas"
                class="flex items-center justify-center bg-sky-500/15 border border-sky-500/35 text-sky-400 hover:bg-sky-500/30 rounded-full px-4 py-2.5 text-sm font-medium transition-colors text-center w-full sm:w-auto">
                ⚙️ Normalización
            </a>
        </div>

        <!-- MODE SELECTOR -->
        <div class="mode-toggle" id="modeToggle">
            <div class="mode-slider" id="modeSlider"></div>
            <button class="mode-btn active" id="btnKicheToEs" onclick="setMode('kiche-es')">K'iche' → Español</button>
            <button class="mode-btn" id="btnEsToKiche" onclick="setMode('es-kiche')">Español → K'iche'</button>
        </div>

        <button id="micBtn" class="btn-mic">🎤</button>

        <div class="status-text" id="status">Mantén presionado para hablar en K'iche'</div>

        <div class="progress-container" id="progressContainer">
            <div class="progress-bar" id="progressBar"></div>
        </div>

        <!-- RESULT BOX K'iche' → ES -->
        <div class="result-box" id="resultBox">
            <div class="result-label" id="labelLang1">K'iche' reconocido</div>
            <textarea class="result-textarea" id="transcriptionInput" rows="2"
                placeholder="Texto reconocido..."></textarea>
            <button class="btn-retranslate" id="retranslateBtn" onclick="retranslate()">🔄 Volver a traducir</button>

            <div class="result-label" id="labelLang2">Español</div>
            <div class="result-text" id="translationText">...</div>

            <div id="audioSection">
                <audio id="audioPlayer" controls></audio>
            </div>

            <div class="note-text" id="noteText"></div>
        </div>
        </div> <!-- FIN COLUMNA 1 -->

        <!-- COLUMNA 2: ASISTENCIA Y RESUMEN -->
        <div class="w-full lg:w-80 flex flex-col gap-6">
            
            <!-- ASISTENCIA GRÁFICA -->
            <div class="container" style="padding: 1.5rem; text-align: center; width: 100%; max-width: none;">
                <h2 class="text-lg font-bold mb-4">🧍 Asistencia Anatómica</h2>
                <div class="relative mx-auto w-40 h-56 border border-white/20 rounded-xl bg-white/5 overflow-hidden">
                    <!-- Cabeza -->
                    <div id="zona-cabeza" class="absolute top-2 left-1/2 -translate-x-1/2 w-8 h-8 border-2 border-white/30 rounded-full transition-all duration-300"></div>
                    <!-- Pecho/Torso -->
                    <div id="zona-pecho" class="absolute top-[44px] left-1/2 -translate-x-1/2 w-12 h-14 border-2 border-white/30 rounded-xl transition-all duration-300"></div>
                    <!-- Estomago -->
                    <div id="zona-estomago" class="absolute top-[104px] left-1/2 -translate-x-1/2 w-10 h-8 border-2 border-white/30 rounded-xl transition-all duration-300"></div>
                    <!-- Brazos -->
                    <div id="zona-brazos" class="absolute top-[44px] left-1/2 -translate-x-1/2 w-24 h-20 border-t-2 border-white/30 transition-all duration-300 rounded-t-xl" style="pointer-events: none; border-left: 2px solid rgba(255,255,255,0.3); border-right: 2px solid rgba(255,255,255,0.3);"></div>
                    <!-- Piernas -->
                    <div id="zona-piernas" class="absolute top-[140px] left-1/2 -translate-x-1/2 w-12 h-16 border-t-2 border-white/30 transition-all duration-300 rounded-b-xl" style="border-left: 2px solid rgba(255,255,255,0.3); border-right: 2px solid rgba(255,255,255,0.3); border-bottom: 2px solid rgba(255,255,255,0.3);"></div>
                </div>
                <p class="text-xs text-white/50 mt-4 leading-relaxed">El sistema detectará palabras clave y resaltará la zona afectada.</p>
            </div>

            <!-- RESUMEN CLÍNICO -->
            <div class="container" style="padding: 1.5rem; width: 100%; max-width: none;">
                <h2 class="text-lg font-bold mb-4 text-center">📝 Resumen Clínico</h2>
                <button onclick="generateSummary()" id="btnGenerateSummary" class="w-full bg-gradient-to-r from-teal-400 to-blue-500 hover:from-teal-500 hover:to-blue-600 text-white font-bold py-2 px-4 rounded-full shadow-lg transition-transform hover:scale-105 mb-4 text-sm">
                    Generar Resumen de Sesión
                </button>
                <textarea id="summaryTextarea" class="w-full bg-white/10 border border-white/20 rounded-lg p-3 text-white text-sm focus:outline-none focus:border-teal-400 min-h-[120px] resize-none mb-3" placeholder="El resumen de triaje generado con IA aparecerá aquí..." readonly></textarea>
                <button onclick="copySummary()" class="w-full bg-white/20 hover:bg-white/30 text-white font-semibold py-1.5 px-4 rounded-lg transition-colors text-sm">
                    📋 Copiar al Portapapeles
                </button>
            </div>

        </div> <!-- FIN COLUMNA 2 -->

    </div>

    <script>
        // ── STATE ──────────────────────────────────────────────────────────
        let currentMode = 'kiche-es'; // 'kiche-es' or 'es-kiche'
        let isRecording = false;
        let audioContext, mediaStream, processor, inputNode, audioData = [];
        let recognition = null;
        let lastSpanishText = '';
        let sessionTranslations = []; // Almacena el historial de síntomas traducidos

        // ── ELEMENTS ───────────────────────────────────────────────────────
        const micBtn = document.getElementById('micBtn');
        const statusEl = document.getElementById('status');
        const progressContainer = document.getElementById('progressContainer');
        const progressBar = document.getElementById('progressBar');
        const resultBox = document.getElementById('resultBox');
        const transcriptionInput = document.getElementById('transcriptionInput');
        const translationText = document.getElementById('translationText');
        const audioPlayer = document.getElementById('audioPlayer');
        const audioSection = document.getElementById('audioSection');
        const noteText = document.getElementById('noteText');
        const labelLang1 = document.getElementById('labelLang1');
        const labelLang2 = document.getElementById('labelLang2');
        const modeSlider = document.getElementById('modeSlider');
        const btnKicheToEs = document.getElementById('btnKicheToEs');
        const btnEsToKiche = document.getElementById('btnEsToKiche');

        // ── MODE TOGGLE ────────────────────────────────────────────────────
        function setMode(mode) {
            currentMode = mode;
            if (mode === 'kiche-es') {
                modeSlider.classList.remove('right');
                btnKicheToEs.classList.add('active');
                btnEsToKiche.classList.remove('active');
                statusEl.textContent = "Mantén presionado para hablar en K'iche'";
                labelLang1.textContent = "K'iche' reconocido";
                labelLang2.textContent = "Español";
                audioSection.style.display = 'block';
                noteText.textContent = '';
            } else {
                modeSlider.classList.add('right');
                btnEsToKiche.classList.add('active');
                btnKicheToEs.classList.remove('active');
                statusEl.textContent = "Mantén presionado para hablar en Español";
                labelLang1.textContent = "Español reconocido";
                labelLang2.textContent = "K'iche'";
                audioSection.style.display = 'none';
                noteText.textContent = "ℹ️ Modo K'iche' solo muestra texto (sin audio).";
            }
            resultBox.style.display = 'none';
            transcriptionInput.value = '';
            translationText.textContent = '...';
        }

        // ── MIC BUTTON ─────────────────────────────────────────────────────
        const startAction = async (e) => {
            e.preventDefault();
            if (!isRecording) {
                if (currentMode === 'kiche-es') {
                    await startKicheRecording();
                } else {
                    startSpanishRecognition();
                }
            }
        };

        const stopAction = (e) => {
            if (isRecording) {
                e.preventDefault();
                if (currentMode === 'kiche-es') {
                    stopKicheRecording();
                } else {
                    stopSpanishRecognition();
                }
            }
        };

        micBtn.addEventListener('mousedown', startAction);
        micBtn.addEventListener('touchstart', startAction, {passive: false});
        window.addEventListener('mouseup', stopAction);
        window.addEventListener('touchend', stopAction);

        // ── MODE: K'ICHE' → ES (WAV via MMS server) ───────────────────────
        async function startKicheRecording() {
            try {
                audioData = [];
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaStream = stream;
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                inputNode = audioContext.createMediaStreamSource(stream);
                processor = audioContext.createScriptProcessor(4096, 1, 1);
                processor.onaudioprocess = e => {
                    audioData.push(new Float32Array(e.inputBuffer.getChannelData(0)));
                };
                inputNode.connect(processor);
                processor.connect(audioContext.destination);

                isRecording = true;
                micBtn.classList.add('recording');
                statusEl.textContent = "Grabando K'iche'... (Suelta para traducir)";
                resultBox.style.display = 'none';
            } catch (err) {
                statusEl.textContent = "Error: No se pudo acceder al micrófono.";
            }
        }

        function stopKicheRecording() {
            if (!isRecording) return;
            isRecording = false;
            micBtn.classList.remove('recording');
            statusEl.textContent = "Procesando con modelo MMS...";
            if (mediaStream) mediaStream.getTracks().forEach(t => t.stop());
            if (inputNode) inputNode.disconnect();
            if (processor) processor.disconnect();
            if (audioContext) audioContext.close();
            sendKicheAudio();
        }

        async function sendKicheAudio() {
            const len = audioData.reduce((a, b) => a + b.length, 0);
            const samples = new Float32Array(len);
            let offset = 0;
            for (const buf of audioData) { samples.set(buf, offset); offset += buf.length; }

            const wavBlob = new Blob([encodeWAV(samples, audioContext ? audioContext.sampleRate : 44100)], { type: 'audio/wav' });
            const formData = new FormData();
            formData.append("audio", wavBlob);

            progressContainer.style.display = 'block';
            simulateProgress();

            try {
                const res = await fetch('/translate', { method: 'POST', body: formData });
                if (!res.ok) { const e = await res.json(); throw new Error(e.error); }
                const data = await res.json();

                progressBar.style.width = '100%';
                setTimeout(() => { progressContainer.style.display = 'none'; progressBar.style.width = '0%'; }, 500);

                statusEl.textContent = "¡Completado!";
                transcriptionInput.value = data.transcription;
                translationText.textContent = data.translation;
                audioPlayer.src = data.audio_url + "?t=" + Date.now();
                audioPlayer.play();
                resultBox.style.display = 'block';

                // Guardar en el historial de sesión y analizar contexto visual
                if (data.translation && !data.translation.startsWith("[Sin traducción")) {
                    sessionTranslations.push(data.translation);
                }
                analyzeMedicalContext(data.translation + " " + data.transcription);

            } catch (err) {
                statusEl.textContent = "Error: " + err.message;
                progressContainer.style.display = 'none';
            }
        }

        // ── RE-TRANSLATE (editable transcription) ──────────────────────────
        async function retranslate() {
            const text = transcriptionInput.value.trim();
            if (!text) return;

            statusEl.textContent = "Traduciendo...";

            if (currentMode === 'kiche-es') {
                // Send corrected K'iche' text to /translate-text
                try {
                    const res = await fetch('/translate-text', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ text: text, source: 'kiche' })
                    });
                    const data = await res.json();
                    if (data.error) throw new Error(data.error);
                    translationText.textContent = data.translation;
                    if (data.audio_url) {
                        audioPlayer.src = data.audio_url + "?t=" + Date.now();
                        audioPlayer.play();
                    }
                    statusEl.textContent = "¡Retradución completada!";
                    
                    if (data.translation && !data.translation.startsWith("[Sin traducción")) {
                        sessionTranslations.push(data.translation);
                    }
                    analyzeMedicalContext(data.translation + " " + text);

                } catch (err) {
                    statusEl.textContent = "Error: " + err.message;
                }
            } else {
                // Already in es-kiche, retranslate to kiche
                await translateToKiche(text);
            }
        }

        // ── MODE: ES → K'ICHE' (Web Speech API) ───────────────────────────
        function startSpanishRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                statusEl.textContent = "Tu navegador no soporta reconocimiento de voz. Usa Chrome o Edge.";
                return;
            }

            recognition = new SpeechRecognition();
            recognition.lang = 'es-GT';
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;
            recognition.continuous = false;

            recognition.onstart = () => {
                isRecording = true;
                micBtn.classList.add('recording');
                statusEl.textContent = "Escuchando en Español... (Suelta para traducir)";
                resultBox.style.display = 'none';
            };

            recognition.onresult = async (event) => {
                const spokenText = event.results[0][0].transcript;
                lastSpanishText = spokenText;
                transcriptionInput.value = spokenText;
                statusEl.textContent = "Traduciendo al K'iche'...";
                await translateToKiche(spokenText);
            };

            recognition.onerror = (e) => {
                statusEl.textContent = "Error de reconocimiento: " + e.error;
                micBtn.classList.remove('recording');
                isRecording = false;
            };

            recognition.onend = () => {
                micBtn.classList.remove('recording');
                isRecording = false;
            };

            recognition.start();
        }

        function stopSpanishRecognition() {
            if (recognition) recognition.stop();
        }

        async function translateToKiche(text) {
            try {
                const res = await fetch('/translate-to-kiche', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: text })
                });
                const data = await res.json();
                if (data.error) throw new Error(data.error);
                translationText.textContent = data.translation;
                resultBox.style.display = 'block';
                statusEl.textContent = "¡Traducción completada!";
                
                if (data.audio_url) {
                    audioPlayer.src = data.audio_url + "?t=" + Date.now();
                    audioPlayer.play();
                }

                // Guardar en el historial (español) y analizar
                sessionTranslations.push(text);
                analyzeMedicalContext(text + " " + data.translation);

            } catch (err) {
                statusEl.textContent = "Error: " + err.message;
            }
        }

        // ── WAV ENCODING UTILS ─────────────────────────────────────────────
        function encodeWAV(samples, sampleRate) {
            const buf = new ArrayBuffer(44 + samples.length * 2);
            const view = new DataView(buf);
            const ws = (off, str) => { for (let i = 0; i < str.length; i++) view.setUint8(off + i, str.charCodeAt(i)); };
            ws(0, 'RIFF'); view.setUint32(4, 36 + samples.length * 2, true); ws(8, 'WAVE');
            ws(12, 'fmt '); view.setUint32(16, 16, true); view.setUint16(20, 1, true);
            view.setUint16(22, 1, true); view.setUint32(24, sampleRate, true);
            view.setUint32(28, sampleRate * 2, true); view.setUint16(32, 2, true);
            view.setUint16(34, 16, true); ws(36, 'data'); view.setUint32(40, samples.length * 2, true);
            let off = 44;
            for (let i = 0; i < samples.length; i++, off += 2) {
                const s = Math.max(-1, Math.min(1, samples[i]));
                view.setInt16(off, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
            }
            return view;
        }

        function simulateProgress() {
            let w = 0;
            const iv = setInterval(() => {
                if (w >= 90) { clearInterval(iv); } else { w++; progressBar.style.width = w + '%'; }
            }, 60);
        }

        // ── ASISTENCIA GRÁFICA ANATÓMICA ──────────────────────────────────
        function analyzeMedicalContext(text) {
            if (!text) return;
            const t = text.toLowerCase();
            
            // Limpiar clases previas
            const zones = ['cabeza', 'pecho', 'estomago', 'brazos', 'piernas'];
            zones.forEach(z => document.getElementById('zona-' + z).classList.remove('highlight-anatomy'));

            // Analizar palabras clave asíncronamente (sin bloquear)
            setTimeout(() => {
                if (t.includes('cabeza') || t.includes('jolom') || t.includes('mareo') || t.includes('lemlot') || t.includes('oído') || t.includes('xiq') || t.includes('nariz') || t.includes('ni\'')) {
                    document.getElementById('zona-cabeza').classList.add('highlight-anatomy');
                }
                if (t.includes('pecho') || t.includes('k\'u\'x') || t.includes('respirar') || t.includes('aire') || t.includes('uxlab') || t.includes('corazón')) {
                    document.getElementById('zona-pecho').classList.add('highlight-anatomy');
                }
                if (t.includes('estómago') || t.includes('panza') || t.includes('vomit') || t.includes('xabik') || t.includes('digest')) {
                    document.getElementById('zona-estomago').classList.add('highlight-anatomy');
                }
                if (t.includes('brazo') || t.includes('mano') || t.includes('q\'ab') || t.includes('hombro') || t.includes('molaj')) {
                    document.getElementById('zona-brazos').classList.add('highlight-anatomy');
                }
                if (t.includes('pierna') || t.includes('pie') || t.includes('rodilla') || t.includes('waqan') || t.includes('wakan') || t.includes('koxol')) {
                    document.getElementById('zona-piernas').classList.add('highlight-anatomy');
                }
            }, 50);
        }

        // ── MOTOR DE RESUMEN CLÍNICO (GROQ) ───────────────────────────────
        async function generateSummary() {
            const btn = document.getElementById('btnGenerateSummary');
            const textarea = document.getElementById('summaryTextarea');
            
            if (sessionTranslations.length === 0) {
                textarea.value = "No hay síntomas registrados en esta sesión para resumir.";
                return;
            }

            btn.disabled = true;
            btn.textContent = "Generando...";
            textarea.value = "Conectando con IA...";

            try {
                const res = await fetch('/generate-summary', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ symptoms: sessionTranslations })
                });
                
                const data = await res.json();
                textarea.value = data.summary || "Error al procesar el resumen.";
                
            } catch (err) {
                textarea.value = "Error al contactar al servidor. Revisa tu conexión.";
                console.error(err);
            } finally {
                btn.disabled = false;
                btn.textContent = "Generar Resumen de Sesión";
            }
        }

        function copySummary() {
            const textarea = document.getElementById('summaryTextarea');
            if (textarea.value && !textarea.value.startsWith('El resumen de triaje')) {
                textarea.select();
                document.execCommand('copy');
                // Deseleccionar
                window.getSelection().removeAllRanges();
                
                // Pequeño feedback visual
                const originalText = textarea.value;
                textarea.value = "¡Copiado!";
                setTimeout(() => {
                    textarea.value = originalText;
                }, 1000);
            }
        }
    </script>
